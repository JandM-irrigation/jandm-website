<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J&M Irrigation - 1-Tap Review</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #1a252c; margin-top: 0; font-size: 24px; }
    p { color: #627d98; font-size: 14px; margin-bottom: 24px; }
    .input-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: bold; color: #486581; text-transform: uppercase; margin-bottom: 6px; }
    input { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
    input:focus { border-color: #0284c7; }
    button { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; color: #ffffff; background-color: #0284c7; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    button:active { background-color: #0369a1; }
    .status-msg { margin-top: 15px; font-size: 14px; display: none; }
    .success { color: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <h2>1-Tap Review Tool</h2>
    <p>Send a quick SMS review request to the customer.</p>

    <form id="reviewForm">
      <div class="input-group">
        <label for="full_name">Customer Full Name</label>
        <input type="text" id="full_name" required placeholder="e.g. John Smith" />
      </div>

      <div class="input-group">
        <label for="phone">Customer Cell Phone</label>
        <input type="tel" id="phone" required placeholder="e.g. 5125550199" />
      </div>

      <button type="submit" id="submitBtn">Send Review Request</button>
    </form>

    <div id="status" class="status-msg success">✓ Sent! Review request incoming.</div>
  </div>

  <script>
    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      
      btn.innerText = "Sending...";
      btn.disabled = true;

      const payload = {
        full_name: document.getElementById('full_name').value,
        phone: document.getElementById('phone').value
      };

      try {
        await fetch("https://services.leadconnectorhq.com/hooks/ccw86eAQJ9Ic1KCOF1e7/webhook-trigger/ddd198db-141c-4a66-948d-b27ea9add753", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        status.style.display = "block";
        document.getElementById('reviewForm').reset();
      } catch (err) {
        alert("Error sending request. Please check connection.");
      } finally {
        btn.innerText = "Send Review Request";
        btn.disabled = false;
        setTimeout(() => { status.style.display = "none"; }, 4000);
      }
    });
  </script>

</body>
</html>
