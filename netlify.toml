[build]
  publish = "."

# Production has no build step: the committed HTML is published as is.
# Deploy previews and branch deploys are stamped noindex (meta tag and X-Robots-Tag header) so a
# hosted preview cannot be indexed. See tools/mark-noindex.mjs.
[context.deploy-preview]
  command = "node tools/mark-noindex.mjs"

[context.branch-deploy]
  command = "node tools/mark-noindex.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The staff review-request tool is not a public page. robots.txt must not block it, or crawlers
# could not read this header.
[[headers]]
  for = "/review.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/images/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/images/work/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/images/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

# The site publishes from the repository root, so keep the function source and build tools out of public view
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Dependency files for the review-request function (Netlify installs them during the deploy)
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.node-version"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.jmirrigationco.com/*"
  to = "https://jmirrigationco.com/:splat"
  status = 301
  force = true
