[build]
  publish = "."

# Production has no build step: the committed HTML is published as is.
# Deploy previews and branch deploys are stamped noindex (meta tag and X-Robots-Tag header) so a
# hosted preview cannot be indexed. See tools/mark-noindex.mjs.
[context.deploy-preview]
  command = "node tools/mark-noindex.mjs"

[context.branch-deploy]
  command = "node tools/mark-noindex.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/images/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/images/work/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

# The site publishes from the repository root, so keep the function source and build tools out of public view
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.jmirrigationco.com/*"
  to = "https://jmirrigationco.com/:splat"
  status = 301
  force = true
