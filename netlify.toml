[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/images/work/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

# The site publishes from the repository root, so keep the function source out of public view
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.jmirrigationco.com/*"
  to = "https://jmirrigationco.com/:splat"
  status = 301
  force = true
